name: KGEU Board Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Runner Info
        run: |
          echo "===== Runner ====="
          uname -a
          echo ""
          echo "===== Public IP ====="
          curl -4 ifconfig.me || true
          echo ""
          echo "===== DNS ====="
          nslookup www.kgeu.org || true

      - name: Test Connection
        run: |
          echo "===== CURL ====="
          curl -I --connect-timeout 15 https://www.kgeu.org || true

          echo ""
          echo "===== WGET ====="
          wget --spider https://www.kgeu.org || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python app.py