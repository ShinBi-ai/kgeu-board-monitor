name: KGEU Board Monitor

on:
  schedule:
    # 10분마다 실행
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: state.json 생성
        run: |
          if [ ! -f state.json ]; then
            echo '{ "boards": {} }' > state.json
          fi

      - name: 게시판 확인
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python app.py

      - name: state.json 저장
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: state.json